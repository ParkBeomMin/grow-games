<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>🔍 화면 확인용 — 베타 전용</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <style>
    /* base.css의 클래스를 그대로 쓰고, 여기서는 세로 목록과 경고 띠만 더해요. */
    .ck-warn {
      background: rgba(239, 99, 81, .16);
      border: 2px solid var(--accent2);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      line-height: 1.6;
      color: var(--cream);
    }
    .ck-warn b { color: var(--accent2); }
    .ck-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
    .ck-card { text-align: left; gap: 8px; padding: 16px 14px; width: 100%; }
    .ck-card .card-title { text-align: left; }
    .ck-steps { margin: 0; padding-left: 1.1em; color: var(--text); font-size: .82rem; line-height: 1.7; }
    .ck-odds { color: var(--accent2); font-size: .78rem; line-height: 1.5; }
    .ck-group { color: var(--sky); font-size: 1.05rem; margin: 6px 0 10px; }
    .ck-back { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <main id="app">
    <section class="screen active">
      <h2>🔍 화면 확인용</h2>
      <!-- 어느 버전을 보고 있는지 — 배포 직후 캐시가 남았는지 바로 알 수 있어요 -->
      <p class="hint" id="ck-version" style="margin:-6px 0 10px">버전 확인 중…</p>

      <div class="ck-warn">
        <b>⚠️ 개발 확인용 — 세이브를 덮어씁니다</b><br />
        시나리오를 누르면 <b>진행 중인 캐릭터가 확인용 세이브로 바뀌어요.</b>
        처음 누를 때 지금 세이브를 통째로 백업하고, 아래 <b>되돌리기</b>로 되살릴 수 있어요.
      </div>

      <div class="ck-back">
        <p class="hint" id="ck-backup-line" style="margin:0"></p>
        <button type="button" class="btn btn-ghost" id="ck-restore" style="margin:0">↩️ 되돌리기 (백업 복구)</button>
      </div>

      <div id="ck-body"></div>

      <p class="hint" id="ck-foot"></p>
      <a class="btn btn-ghost" href="index.html" style="display:block;text-align:center;text-decoration:none">🎮 베타 게임 목록으로</a>
    </section>
  </main>

  <script src="env.js"></script>
  <script src="_fixtures.js"></script>
  <script>
  /* 확인용 페이지 — 베타 전용이에요. 상용(루트)에는 절대 올리지 마세요.
   * scripts/promote.sh가 _로 시작하는 파일을 걸러 내지만, 옮길 때 한 번 더 확인하세요.
   *
   * env.js를 먼저 불러요. 이 페이지도 /beta/ 안이라 localStorage가 'beta::'로 감싸지고,
   * 그래야 같은 베타의 게임이 읽는 키에 심겨요. */
  "use strict";
  window.CheckPage = (() => {
    const BACKUP_KEY = "grow-check-backup";
    const F = (window.CHECK_FIXTURES || { items: [] });
    const GAME_NAME = {
      soccer: "⚽ 더 윙어 (축구)",
      idol: "🎤 더 트레이니 (아이돌)",
      rookie: "⚾ 더 드래프트 (야구)",
    };
    // 화면에 그리는 순서예요. 여기 없는 게임은 카드가 아예 안 그려져요.
    const GAME_ORDER = ["soccer", "idol", "rookie"];
    const $ = (id) => document.getElementById(id);

    // localStorage 열거는 key(i)로 해요 — env.js가 씌운 래퍼에는 Object.keys가 안 통해요.
    function allKeys() {
      const out = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k) out.push(k);
      }
      return out;
    }

    // 시나리오가 건드리는 키 전부 — 심기 전에 이것만 비워요. 사용자 취향은 안 건드려요.
    function fixtureKeys() {
      const s = new Set();
      for (const it of F.items) for (const k in it.keys) s.add(k);
      return [...s];
    }

    function backupInfo() {
      try {
        const raw = localStorage.getItem(BACKUP_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }

    /* 백업은 딱 한 번만 떠요. 두 번째 시나리오를 누를 때 다시 뜨면
     * 방금 심은 확인용 세이브가 백업을 덮어써서 진짜 캐릭터가 사라져요. */
    function backupOnce() {
      if (backupInfo()) return false;
      const data = {};
      for (const k of allKeys()) if (k !== BACKUP_KEY) data[k] = localStorage.getItem(k);
      localStorage.setItem(BACKUP_KEY, JSON.stringify({ at: Date.now(), data }));
      return true;
    }

    function restore() {
      const b = backupInfo();
      if (!b) return false;
      for (const k of allKeys()) if (k !== BACKUP_KEY) localStorage.removeItem(k);
      for (const k in b.data) localStorage.setItem(k, b.data[k]);
      localStorage.removeItem(BACKUP_KEY);
      render();
      return true;
    }

    function seed(id) {
      const it = F.items.find((x) => x.id === id);
      if (!it) return false;
      backupOnce();
      for (const k of fixtureKeys()) localStorage.removeItem(k);
      for (const k in it.keys) localStorage.setItem(k, it.keys[k]);
      return true;
    }

    // 이동은 따로 빼 둬요 — jsdom 검사에서 갈아 끼워 심기만 확인할 수 있게요.
    const api = { BACKUP_KEY, seed, restore, backupInfo, backupOnce, fixtureKeys, allKeys, render, items: F.items };
    api.nav = (url) => { location.href = url; };

    function go(id) {
      const it = F.items.find((x) => x.id === id);
      if (!it || !seed(id)) return;
      api.nav(it.url);
    }

    function esc(s) {
      return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    function render() {
      const b = backupInfo();
      $("ck-backup-line").innerHTML = b
        ? `💾 백업 있음 — ${new Date(b.at).toLocaleString("ko-KR")} · 키 ${Object.keys(b.data).length}개`
        : "💾 백업 없음 — 시나리오를 처음 누를 때 지금 세이브를 통째로 백업해요.";
      $("ck-restore").disabled = !b;

      const body = $("ck-body");
      body.innerHTML = "";
      if (!F.items.length) {
        body.innerHTML = `<p class="hint">시나리오가 없어요. <code>node scripts/make-fixtures.js</code>로 먼저 뽑아 주세요.</p>`;
        return;
      }
      for (const game of GAME_ORDER) {
        const mine = F.items.filter((x) => x.game === game);
        if (!mine.length) continue;
        const h = document.createElement("h3");
        h.className = "ck-group";
        h.textContent = GAME_NAME[game] || game;
        body.appendChild(h);

        const list = document.createElement("div");
        list.className = "ck-list";
        for (const it of mine) {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "card ck-card";
          card.dataset.id = it.id;
          const steps = (it.steps || []).map((s) => `<li>${s}</li>`).join("");
          card.innerHTML =
            `<span class="card-emoji" aria-hidden="true">${esc(it.emoji || "🔍")}</span>` +
            `<span class="card-title">${esc(it.title)}</span>` +
            `<span class="card-desc">👀 ${it.check}</span>` +
            `<span class="card-desc">📍 ${esc(it.state || "")}</span>` +
            `<ol class="ck-steps">${steps}</ol>` +
            (it.odds
              ? `<span class="ck-odds">🎲 이 화면은 세이브만으로는 못 만들어요 — 판정 결과라서요.` +
                ` 도전 직전 상태를 심어 드려요. ${esc(it.odds.label)}이 나올 확률은 ` +
                `<b>약 ${it.odds.pct}%</b>예요 (같은 세이브로 ${it.odds.tries}번 굴려서 잰 값).` +
                ` 다른 엔딩이 나오면 이 카드를 다시 누르세요.</span>`
              : "");
          card.onclick = () => go(it.id);
          list.appendChild(card);
        }
        body.appendChild(list);
      }
      $("ck-foot").textContent =
        `🗓️ ${F.generatedAt || "?"} 에 뽑은 세이브예요. 산식이 바뀌면 node scripts/make-fixtures.js 로 다시 뽑으세요.`;

    /* 지금 보고 있는 게 어느 버전인지 — 배포했는데 화면이 그대로면
     * 대개 서비스워커 캐시예요. 여기서 바로 가려낼 수 있어요. */
    fetch("../VERSION", { cache: "no-store" })
      .then((r) => (r.ok ? r.text() : Promise.reject()))
      .then((v) => { document.getElementById("ck-version").textContent = `📦 상용 VERSION ${v.trim()} · 이 페이지는 beta/`; })
      .catch(() => { document.getElementById("ck-version").textContent = "📦 VERSION을 못 읽었어요 (로컬 파일로 열면 안 보여요)"; });
    }

    /* 이 스크립트는 </body> 바로 앞이라, 필요한 요소는 이미 다 파싱돼 있어요.
     * DOMContentLoaded를 기다리면 파싱이 끝난 뒤에야 그려지는데, jsdom 검사는
     * 그 전에 화면을 읽어서 "버튼이 하나도 없다"로 보여요. 바로 그립니다. */
    render();
    $("ck-restore").onclick = restore;
    return api;
  })();
  </script>
</body>
</html>
