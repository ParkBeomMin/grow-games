<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>📊 키우기 시리즈 · 통계 대시보드</title>
  <style>
    :root {
      --bg: #0e1420; --bg2: #172032; --line: #29354c; --accent: #ffd166;
      --sky: #7fd1e8; --text: #eef2f8; --dim: #93a3bd; --good: #6ee7a0; --bad: #ef6351;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px 16px 60px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg); z-index: 50; }
    .gate-box { width: 100%; max-width: 320px; background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 28px 22px; text-align: center; }
    .gate-emoji { font-size: 2.4rem; }
    .gate-box h2 { font-size: 1.15rem; margin: 6px 0 2px; }
    .gate-hint { color: var(--dim); font-size: .82rem; margin-bottom: 16px; }
    .gate-box input[type="password"] { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 1rem; }
    .gate-remember { display: flex; align-items: center; gap: 6px; justify-content: center; color: var(--dim); font-size: .78rem; margin: 12px 0; }
    .gate-btn { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #10131f; font-weight: 700; font-size: .95rem; cursor: pointer; }
    .gate-err { color: #ff6b6b; font-size: .82rem; min-height: 1.1em; margin-top: 10px; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .sub { color: var(--dim); font-size: .85rem; margin-bottom: 20px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 24px; }
    .kpi { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .kpi .n { font-size: 1.7rem; font-weight: 700; color: var(--accent); }
    .kpi .l { font-size: .78rem; color: var(--dim); margin-top: 2px; }
    section { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
    section h2 { font-size: 1rem; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: thin; padding: 8px 4px; position: sticky; top: 0; z-index: 20; background: var(--bg); -webkit-overflow-scrolling: touch; }
    .tab { flex: 0 0 auto; white-space: nowrap; padding: 8px 14px; border: 1px solid var(--line); background: var(--bg2); color: var(--dim); border-radius: 999px; cursor: pointer; font-size: .88rem; }
    .tab.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: .85rem; }
    .bar-label { width: 96px; flex-shrink: 0; color: var(--dim); text-align: right; }
    .bar-track { flex: 1; background: #0a0f18; border-radius: 6px; height: 22px; position: relative; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--sky), var(--accent)); border-radius: 6px; min-width: 2px; transition: width .5s ease; }
    .bar-val { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: .76rem; color: var(--text); font-weight: 600; }
    .funnel .bar-fill { background: linear-gradient(90deg, #5b8def, var(--sky)); }
    .spark { display: flex; align-items: flex-end; gap: 4px; margin-top: 8px; }
    .spark .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
    .spark .col { cursor: pointer; outline: none; }
    .spark .col .b { width: 100%; background: linear-gradient(180deg, var(--accent), var(--sky)); border-radius: 3px 3px 0 0; min-height: 2px; transition: filter .12s; }
    .spark .col .v { font-size: .58rem; font-weight: 700; color: var(--text); }
    .spark .col .d { font-size: .58rem; color: var(--dim); }
    .spark .col:hover .b, .spark .col:focus .b, .spark .col.active .b { filter: brightness(1.25); box-shadow: 0 0 0 2px var(--accent); }
    .sparktip { position: fixed; z-index: 40; background: var(--bg2); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 10px; font-size: .76rem; color: var(--text); white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.45); transform: translate(-50%, calc(-100% - 8px)); pointer-events: none; display: none; }
    .empty { color: var(--dim); font-size: .85rem; padding: 8px 0; }
    .setup { border-color: var(--accent); }
    .setup pre { background: #0a0f18; border-radius: 10px; padding: 14px; overflow-x: auto; font-size: .74rem; line-height: 1.6; color: #cfe3ff; margin: 10px 0; white-space: pre; }
    .setup .copy { background: var(--accent); color: #3a2a00; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 700; cursor: pointer; }
    .err { color: var(--bad); font-size: .8rem; }
    .refresh { background: transparent; border: 1px solid var(--line); color: var(--sky); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: .82rem; }
    a.home { color: var(--sky); font-size: .82rem; text-decoration: none; }
  </style>
</head>
<body>
  <!-- 비밀번호 게이트 -->
  <div id="gate">
    <form id="gate-form" class="gate-box">
      <div class="gate-emoji">🔒</div>
      <h2>통계 대시보드</h2>
      <p class="gate-hint">비밀번호를 입력하세요</p>
      <input id="gate-pw" type="password" autocomplete="current-password" placeholder="비밀번호" />
      <label class="gate-remember"><input type="checkbox" id="gate-remember" checked /> 이 기기에서 기억하기</label>
      <button class="gate-btn" type="submit">들어가기</button>
      <p class="gate-err" id="gate-err"></p>
    </form>
  </div>

  <div class="wrap" id="wrap" hidden>
    <h1>📊 통계 대시보드</h1>
    <p class="sub">키우기 시리즈 · <a class="home" href="../">🎮 게임으로</a> · <button class="refresh" id="refresh">↻ 새로고침</button> · <button class="refresh" id="lockout">🔒 잠그기</button></p>

    <div id="overview"><p class="empty">불러오는 중…</p></div>
    <nav class="tabs" id="tabs" hidden></nav>
    <div id="panel"></div>
  </div>

  <script src="../env.js"></script>
  <script>
    const SUPABASE_URL = "https://dlbpvzgwwcgphlhymncx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsYnB2emd3d2NncGhsaHltbmN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3ODA3MTMsImV4cCI6MjEwMDM1NjcxM30.tyLMO8o_i5OTmKaRudFd5LATDjmjVzL8M2NM_4EoeBc";

    const H = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

    const GAMES = { rookie: "⚾ 더 루키", idol: "🎤 더 트레이니", stock: "📈 더 인베스터", soccer: "⚽ 더 윙어", dev: "💻 더 커밋", chef: "🍜 더 셰프", stream: "📺 더 스트리머", unicorn: "🦄 더 유니콘" };

    // ---------- 탭 상태 ----------
    // URL 해시가 단일 진실 원천이에요. 클릭·뒤로가기·링크 진입이 모두 hashchange 한 곳을 타요.
    const GAME_KEYS = Object.keys(GAMES);
    let STATE = null;        // load()가 채우는 fetch 결과 캐시
    let activeGame = null;   // 현재 탭 (GAMES의 키)

    const gameFromHash = () => {
      const h = decodeURIComponent(location.hash.replace(/^#/, ""));
      return Object.prototype.hasOwnProperty.call(GAMES, h) ? h : GAME_KEYS[0];
    };

    const POS = {
      batter: "타자", pitcher: "투수", vocal: "보컬", dance: "댄스", rap: "랩",
      value: "가치투자", scalp: "단타", news: "정보매매", port: "분산투자",
      fw: "공격수", mf: "미드필더", df: "수비수", wg: "윙어",
      front: "프론트엔드", back: "백엔드", ai: "AI·데이터", devops: "데브옵스",
      korean: "한식", western: "양식", dessert: "디저트", chinese: "중식",
      game: "게임 방송", talk: "토크", variety: "예능·챌린지", irl: "야외·일상",
    };
    // 예전 id로 저장된 선택값을 읽기 좋은 이름으로 합쳐요 (id↔이름 혼재 방지)
    const CHOICE_ALIAS = {
      seoul: "서울", gyeongin: "인천·경기", chungcheong: "대전·충청",
      honam: "광주·전라", daegu: "대구·경북", busan: "부산·경남",
      sw: "SW엔터", onlyone: "온리원컴퍼니", luna: "루나엔터", byeol: "별빛엔터", garage: "개러지뮤직",
      kospi: "국장", us: "미장", jp: "일본장",
    };
    const normChoice = (c) => CHOICE_ALIAS[c] || c;
    const EVENT_LABEL = {
      visit: "방문", new_player: "새 캐릭터", draft: "드래프트", ending: "서바이벌 결과",
      pro_enter: "프로 입단", debut: "데뷔", season_end: "시즌 결산", year_end: "연말 결산",
      retire: "은퇴", battle: "배틀", bonus: "보너스",
      pwa_install: "📲 앱 설치", pwa_launch: "📲 앱 실행",
      exit: "🚀 Exit(재창업)", decacorn: "👑 데카콘 달성",
    };

    async function getView(name) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${name}?select=*`, { headers: H });
      if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
      return res.json();
    }

    const bar = (label, val, max, cls = "") =>
      `<div class="bar-row"><div class="bar-label">${esc(label)}</div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${max ? Math.max(2, (val / max) * 100) : 2}%"></div>
        <span class="bar-val">${val.toLocaleString()}</span></div></div>`;

    function choiceSection(rows) {
      let html = "";
      for (const game of Object.keys(GAMES)) {
        const g = rows.filter((r) => r.game === game && r.choice);
        if (!g.length) continue;
        const agg = {};
        for (const r of g) { const c = normChoice(r.choice); agg[c] = (agg[c] || 0) + r.n; }
        const items = Object.entries(agg).sort((a, b) => b[1] - a[1]);
        const max = items[0][1];
        const title = game === "rookie" ? "지역 선택 분포" : "소속사 선택 분포";
        html += `<section><h2>${GAMES[game]} · ${title}</h2>${items.map(([k, v]) => bar(k, v, max)).join("")}</section>`;

        // 포지션 분포
        const pos = {};
        for (const r of g) if (r.pos) pos[r.pos] = (pos[r.pos] || 0) + r.n;
        const pi = Object.entries(pos).sort((a, b) => b[1] - a[1]);
        if (pi.length) {
          const pmax = pi[0][1];
          html += `<section><h2>${GAMES[game]} · 포지션 분포</h2>${pi.map(([k, v]) => bar(POS[k] || k, v, pmax)).join("")}</section>`;
        }
      }
      return html || `<section><h2>선택 분포</h2><p class="empty">아직 새 캐릭터 데이터가 없어요.</p></section>`;
    }

    function funnelSection(rows, hofByGame) {
      let html = "";
      for (const game of Object.keys(GAMES)) {
        const g = rows.filter((r) => r.game === game);
        if (!g.length) continue;
        const order = ["visit", "pwa_install", "pwa_launch", "new_player", "draft", "debut", "ending", "pro_enter", "season_end", "year_end", "exit", "decacorn", "retire", "battle", "bonus"];
        g.sort((a, b) => order.indexOf(a.event) - order.indexOf(b.event));
        const max = Math.max(...g.map((r) => r.total));
        const hofN = hofByGame ? (hofByGame[game] || 0) : null;
        html += `<section class="funnel"><h2>${GAMES[game]} · 이벤트별 발생${hofN != null ? ` · 🏛️명전 ${hofN}명` : ""}</h2>${
          g.map((r) => bar(EVENT_LABEL[r.event] || r.event, r.total, max)).join("")
        }</section>`;
      }
      return html;
    }

    // 🦄 더 유니콘 — 방치형이라 지표가 달라요 (포지션 대신 Exit·스톡옵션·최고 단계)
    const UNI_STAGES = ["부트스트랩", "프리시드", "시드 투자", "시리즈 A", "시리즈 B", "시리즈 C", "유니콘", "데카콘"];
    function unicornSection(hofRows) {
      if (!hofRows) return "";
      const es = hofRows.filter((r) => r.game === "unicorn" && r.data).map((r) => r.data);
      if (!es.length) return `<section><h2>🦄 더 유니콘 · 창업가 기록</h2><p class="empty">아직 은퇴한 창업가가 없어요.</p></section>`;

      const num = (v) => (typeof v === "number" && isFinite(v) ? v : 0);
      const deca = es.filter((e) => e.stage === "데카콘").length;
      const best = es.reduce((a, b) => (num(b.score) > num(a.score) ? b : a));
      const avgExit = es.reduce((s, e) => s + num(e.exits), 0) / es.length;
      const maxSo = Math.max(...es.map((e) => num(e.so)));

      let html = `<section><h2>🦄 더 유니콘 · 창업가 기록</h2>
        <div class="kpis">
          <div class="kpi"><div class="n">${es.length.toLocaleString()}</div><div class="l">🏛️ 은퇴 창업가</div></div>
          <div class="kpi"><div class="n">${deca.toLocaleString()}</div><div class="l">👑 데카콘 달성</div></div>
          <div class="kpi"><div class="n">${avgExit.toFixed(1)}</div><div class="l">🚀 평균 Exit</div></div>
          <div class="kpi"><div class="n">${maxSo.toLocaleString()}</div><div class="l">🧾 최고 스톡옵션</div></div>
        </div></section>`;

      // 최고 단계 분포
      const byStage = {};
      for (const e of es) byStage[e.stage || "-"] = (byStage[e.stage || "-"] || 0) + 1;
      const si = UNI_STAGES.filter((s) => byStage[s]).map((s) => [s, byStage[s]]);
      if (si.length) {
        const smax = Math.max(...si.map((x) => x[1]));
        html += `<section><h2>🦄 더 유니콘 · 최고 단계 분포</h2>${si.map(([k, v]) => bar(k, v, smax)).join("")}</section>`;
      }

      // Exit 횟수 분포
      const byExit = {};
      for (const e of es) { const k = num(e.exits) >= 4 ? "4회 이상" : `${num(e.exits)}회`; byExit[k] = (byExit[k] || 0) + 1; }
      const order = ["0회", "1회", "2회", "3회", "4회 이상"];
      const ei = order.filter((k) => byExit[k]).map((k) => [k, byExit[k]]);
      if (ei.length) {
        const emax = Math.max(...ei.map((x) => x[1]));
        html += `<section><h2>🦄 더 유니콘 · Exit 횟수 분포</h2>${ei.map(([k, v]) => bar(k, v, emax)).join("")}</section>`;
      }

      // 상위 기록
      const top = [...es].sort((a, b) => num(b.score) - num(a.score)).slice(0, 5);
      const tmax = num(top[0].score);
      html += `<section><h2>🦄 더 유니콘 · 최고 기록 TOP ${top.length}</h2>${
        top.map((e, i) => bar(`${i + 1}. ${e.name || "-"} (${e.stage || "-"} · Exit ${num(e.exits)}회)`, num(e.score), tmax)).join("")
      }<p class="empty" style="margin-top:8px">최고 기록: ${esc(best.name || "-")} · ${esc(best.grade || "-")}</p></section>`;
      return html;
    }

    // game이 null이면 전 게임 합산(#overview), 게임 키면 그 게임만(#panel)이에요.
    function dailySection(rows, game) {
      const src = game ? rows.filter((r) => r.game === game) : rows;
      const byDay = {};
      for (const r of src) {
        byDay[r.day] = byDay[r.day] || { visits: 0, np: 0 };
        byDay[r.day].visits += r.visits || 0;
        byDay[r.day].np += r.new_players || 0;
      }
      const days = Object.keys(byDay).sort().slice(-14);
      if (!days.length) return "";
      const max = Math.max(...days.map((d) => byDay[d].visits), 1);
      const title = game
        ? "📅 방문 추이 (일별 순 방문 기기)"
        : "📅 최근 방문 추이 (전 게임 합산 · 일별 순 방문 기기)";
      return `<section><h2>${title}</h2>
        <p class="empty" style="margin:-6px 0 10px">막대를 누르거나 마우스를 올리면 상세 숫자를 볼 수 있어요</p>
        <div class="spark">${days.map((d) => {
          const v = byDay[d].visits;
          const np = byDay[d].np;
          const md = d.slice(5);
          const [, mo, da] = d.split("-");
          const h = Math.max(3, Math.round((v / max) * 90));
          const info = `${+mo}월 ${+da}일 · 방문 ${v}명 · 새 캐릭터 ${np}명`;
          return `<div class="col" tabindex="0" data-info="${info}"><div class="v">${v}</div><div class="b" style="height:${h}px"></div><div class="d">${md}</div></div>`;
        }).join("")}</div></section>`;
    }

    const SETUP_SQL = `-- Supabase SQL Editor에서 1회 실행 (집계 전용 읽기 뷰)
create or replace view public.stats_summary as
  select game, event, count(*)::int total, count(distinct player)::int players
  from public.events group by game, event;

create or replace view public.stats_choices as
  select game, coalesce(data->>'region', data->>'agency') choice,
    data->>'pos' pos, count(*)::int n
  from public.events where event = 'new_player'
  group by 1, 2, 3;

create or replace view public.stats_daily as
  select game,
    (ts at time zone 'Asia/Seoul')::date as "day",
    count(*) filter (where event = 'visit') as visits,
    count(*) filter (where event = 'new_player') as new_players
  from public.events group by 1, 2;

grant select on public.stats_summary, public.stats_choices, public.stats_daily to anon;`;

    function setupCard(msg) {
      return `<section class="setup"><h2>⚙️ 통계 뷰 설정이 필요해요</h2>
        <p class="empty">${msg} 아래 SQL을 Supabase → SQL Editor에서 한 번만 실행하면 여기에 통계가 떠요.</p>
        <pre id="sql">${esc(SETUP_SQL)}</pre>
        <button class="copy" id="copysql">📋 SQL 복사</button></section>`;
    }

    // 명예의 전당 실제 등록 인원 (hof 테이블 직접 조회 — 읽기 정책 open)
    async function getHof() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/hof?select=game,data&limit=5000`, { headers: H });
        if (!res.ok) return null;
        return res.json();
      } catch { return null; }
    }

    function emptyCard(game) {
      return `<section><h2>${GAMES[game]}</h2><p class="empty">아직 수집된 데이터가 없어요.<br>플레이어가 새 캐릭터를 만들면 여기에 분포와 퍼널이 뜨기 시작해요.</p></section>`;
    }

    // 전역 KPI + 합산 방문 추이 — 탭과 무관하게 항상 보여요.
    function renderOverview() {
      const summary = STATE.summary;
      const totalVisits = summary.filter((r) => r.event === "visit").reduce((a, r) => a + r.players, 0);
      const totalNew = summary.filter((r) => r.event === "new_player").reduce((a, r) => a + r.total, 0);
      const totalBattle = summary.filter((r) => r.event === "battle").reduce((a, r) => a + r.total, 0);
      const totalRetire = summary.filter((r) => r.event === "retire").reduce((a, r) => a + r.total, 0);
      const totalInstall = summary.filter((r) => r.event === "pwa_install").reduce((a, r) => a + r.total, 0);
      const totalPwaUsers = summary.filter((r) => r.event === "pwa_launch").reduce((a, r) => a + r.players, 0);
      const hofTotal = STATE.hofTotal;

      let html = `<div class="kpis">
        <div class="kpi"><div class="n">${totalVisits.toLocaleString()}</div><div class="l">순 방문자</div></div>
        <div class="kpi"><div class="n">${totalNew.toLocaleString()}</div><div class="l">새 캐릭터</div></div>
        <div class="kpi"><div class="n">${totalInstall.toLocaleString()}</div><div class="l">📲 앱 설치 수</div></div>
        <div class="kpi"><div class="n">${totalPwaUsers.toLocaleString()}</div><div class="l">📲 앱 사용 기기</div></div>
        <div class="kpi"><div class="n">${totalBattle.toLocaleString()}</div><div class="l">배틀 횟수</div></div>
        <div class="kpi"><div class="n">${totalRetire.toLocaleString()}</div><div class="l">은퇴 이벤트</div></div>
        ${hofTotal != null ? `<div class="kpi"><div class="n">${hofTotal.toLocaleString()}</div><div class="l">🏛️ 명예의 전당</div></div>` : ""}
      </div>
      ${hofTotal != null && hofTotal !== totalRetire
        ? `<p class="empty" style="margin:-12px 0 20px">ℹ️ 은퇴 이벤트(${totalRetire})는 통계 도입 이후 집계, 명예의 전당(${hofTotal})은 전체 은퇴자 명단이라 숫자가 달라요.</p>`
        : ""}`;

      html += dailySection(STATE.daily, null);

      if (!summary.length) html = setupCard("뷰는 있는데 아직 수집된 데이터가 없어요.") + html;
      $("overview").innerHTML = html;
      wireCopy();
    }

    function renderTabs() {
      if (!STATE) { $("tabs").hidden = true; $("tabs").innerHTML = ""; return; }
      $("tabs").innerHTML = GAME_KEYS.map((g) =>
        `<button type="button" class="tab${g === activeGame ? " on" : ""}" data-game="${g}">${GAMES[g]}</button>`
      ).join("");
      // 해시로 오른쪽 끝 탭에 바로 들어오면 칩이 스크롤 밖에 있어요.
      const on = $("tabs").querySelector(".tab.on");
      if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
    }

    function renderPanel() {
      if (!STATE) { $("panel").innerHTML = ""; return; }
      const game = activeGame;
      const parts = [
        dailySection(STATE.daily, game),
      ];
      $("panel").innerHTML = parts.join("").trim() || emptyCard(game);
    }

    async function load() {
      $("overview").innerHTML = `<p class="empty">불러오는 중…</p>`;
      $("tabs").hidden = true;
      $("panel").innerHTML = "";

      let summary, choices, daily, failed = false;
      try { summary = await getView("stats_summary"); } catch { failed = true; }
      try { choices = await getView("stats_choices"); } catch { failed = true; }
      try { daily = await getView("stats_daily"); } catch { failed = true; }
      const hofRows = await getHof();
      let hofTotal = null, hofByGame = null;
      if (hofRows) {
        hofByGame = {};
        for (const r of hofRows) hofByGame[r.game] = (hofByGame[r.game] || 0) + 1;
        hofTotal = hofRows.length;
      }

      if (failed || !summary) {
        // 집계 뷰가 없으면 탭이 의미 없어요 — 안내 카드만 남기고 캐시도 비워요.
        // (STATE를 남겨두면 이후 hashchange가 낡은 데이터를 패널에 다시 그려요)
        STATE = null;
        $("overview").innerHTML = setupCard("아직 집계 뷰가 없거나 접근할 수 없어요.");
        wireCopy();
        return;
      }

      STATE = { summary, choices: choices || [], daily: daily || [], hofRows, hofByGame, hofTotal };
      // 새로고침일 땐 보던 탭을 유지하고, 첫 진입이면 해시에서 읽어요.
      activeGame = activeGame || gameFromHash();

      renderOverview();
      $("tabs").hidden = false;
      renderTabs();
      renderPanel();
    }

    function wireCopy() {
      const btn = $("copysql");
      if (btn) btn.onclick = () => {
        navigator.clipboard?.writeText(SETUP_SQL).then(
          () => (btn.textContent = "✅ 복사됨!"),
          () => (btn.textContent = "복사 실패")
        );
      };
    }

    $("refresh").onclick = load;

    // 탭 클릭은 해시만 바꿔요. 렌더는 hashchange 한 곳이 전담해서 경로가 하나로 모여요.
    $("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (btn) location.hash = btn.dataset.game;
    });
    window.addEventListener("hashchange", () => {
      activeGame = gameFromHash();
      renderTabs();
      renderPanel();
    });

    // ---------- 방문 추이 막대 툴팁 (마우스오버 / 클릭·탭) ----------
    // load()가 내용을 다시 그려도 유지되도록 document에 위임해요.
    (function sparkTooltip() {
      const tip = document.createElement("div");
      tip.className = "sparktip";
      document.body.appendChild(tip);
      let activeCol = null;   // 현재 툴팁이 떠 있는 칼럼
      let pinned = null;      // 클릭/탭으로 고정된 칼럼 (모바일 탭 유지용)
      const inCol = (el) => (el && el.closest ? el.closest(".spark .col") : null);
      function showFor(col) {
        if (!col || !col.dataset.info) return;
        if (activeCol && activeCol !== col) activeCol.classList.remove("active");
        activeCol = col;
        col.classList.add("active");
        tip.textContent = col.dataset.info;
        const r = col.getBoundingClientRect();
        tip.style.left = r.left + r.width / 2 + "px";
        tip.style.top = r.top + "px";
        tip.style.display = "block";
      }
      function hide() {
        tip.style.display = "none";
        if (activeCol) { activeCol.classList.remove("active"); activeCol = null; }
      }
      // 마우스 오버: 고정된 게 없을 때만 미리보기로 표시
      document.addEventListener("mouseover", (e) => {
        if (pinned) return;
        const c = inCol(e.target);
        if (c) showFor(c);
      });
      document.addEventListener("mouseout", (e) => {
        if (pinned) return;
        const c = inCol(e.target);
        if (!c) return;
        // 같은 칼럼 안(자식 요소)으로 이동한 거면 닫지 않아요
        if (inCol(e.relatedTarget) !== c) hide();
      });
      // 클릭/탭: 고정 토글 (모바일은 hover가 없어 이걸로 표시)
      document.addEventListener("click", (e) => {
        const c = inCol(e.target);
        if (c) { if (pinned === c) { pinned = null; hide(); } else { pinned = c; showFor(c); } }
        else { pinned = null; hide(); }
      });
      document.addEventListener("focusin", (e) => {
        const c = inCol(e.target);
        if (c) showFor(c);
      });
      window.addEventListener("scroll", () => { pinned = null; hide(); }, { passive: true });
    })();

    // ---------- 비밀번호 게이트 ----------
    // 소스에는 비번 평문이 아니라 SHA-256 해시만 담겨요.
    // 비번 변경: 콘솔에서
    //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('새비번'))
    //     .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
    // 로 새 해시를 뽑아 아래 PW_HASH 값을 바꾸면 돼요.
    const PW_HASH = "fbb9231b254d3e4674b21df93f9e65050c9a89d551e86561a96c74085c75d88b";
    const REMEMBER_KEY = "grow-stats-auth";

    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, "0")).join("");
    }

    function unlock() {
      $("gate").style.display = "none";
      $("wrap").hidden = false;
      load();
    }

    function lock() {
      try { localStorage.removeItem(REMEMBER_KEY); } catch { /* noop */ }
      try { sessionStorage.removeItem(REMEMBER_KEY); } catch { /* noop */ }
      location.reload();
    }

    async function initGate() {
      // 기억해둔 인증(해시 일치)이 있으면 바로 통과
      try {
        const saved = localStorage.getItem(REMEMBER_KEY) || sessionStorage.getItem(REMEMBER_KEY);
        if (saved && saved === PW_HASH) { unlock(); return; }
      } catch { /* noop */ }

      $("gate-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const val = $("gate-pw").value;
        const h = await sha256(val);
        if (h === PW_HASH) {
          try {
            const store = $("gate-remember").checked ? localStorage : sessionStorage;
            store.setItem(REMEMBER_KEY, h);
          } catch { /* noop */ }
          unlock();
        } else {
          $("gate-err").textContent = "비밀번호가 틀렸어요";
          $("gate-pw").value = "";
          $("gate-pw").focus();
        }
      });
      $("gate-pw").focus();
    }

    $("lockout").onclick = lock;
    initGate();
  </script>
</body>
</html>
