<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>📊 키우기 시리즈 · 통계 대시보드</title>
  <style>
    :root {
      --bg: #0e1420; --bg2: #172032; --line: #29354c; --accent: #ffd166;
      --sky: #7fd1e8; --text: #eef2f8; --dim: #93a3bd; --good: #6ee7a0; --bad: #ef6351;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px 16px 60px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg); z-index: 50; }
    .gate-box { width: 100%; max-width: 320px; background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 28px 22px; text-align: center; }
    .gate-emoji { font-size: 2.4rem; }
    .gate-box h2 { font-size: 1.15rem; margin: 6px 0 2px; }
    .gate-hint { color: var(--dim); font-size: .82rem; margin-bottom: 16px; }
    .gate-box input[type="password"] { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 1rem; }
    .gate-remember { display: flex; align-items: center; gap: 6px; justify-content: center; color: var(--dim); font-size: .78rem; margin: 12px 0; }
    .gate-btn { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #10131f; font-weight: 700; font-size: .95rem; cursor: pointer; }
    .gate-err { color: #ff6b6b; font-size: .82rem; min-height: 1.1em; margin-top: 10px; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .sub { color: var(--dim); font-size: .85rem; margin-bottom: 20px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 24px; }
    .kpi { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .kpi .n { font-size: 1.7rem; font-weight: 700; color: var(--accent); }
    .kpi .l { font-size: .78rem; color: var(--dim); margin-top: 2px; }
    section { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
    section h2 { font-size: 1rem; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: thin; padding: 8px 4px; position: sticky; top: 0; z-index: 20; background: var(--bg); -webkit-overflow-scrolling: touch; }
    .tabs[hidden] { display: none; }
    .tab { flex: 0 0 auto; white-space: nowrap; padding: 8px 14px; border: 1px solid var(--line); background: var(--bg2); color: var(--dim); border-radius: 999px; cursor: pointer; font-size: .88rem; }
    .tab.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: .85rem; }
    .bar-label { width: 96px; flex-shrink: 0; color: var(--dim); text-align: right; }
    .bar-track { flex: 1; background: #0a0f18; border-radius: 6px; height: 22px; position: relative; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--sky), var(--accent)); border-radius: 6px; min-width: 2px; transition: width .5s ease; }
    .bar-val { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: .76rem; color: var(--text); font-weight: 600; }
    .funnel .bar-fill { background: linear-gradient(90deg, #5b8def, var(--sky)); }
    .spark { display: flex; align-items: flex-end; gap: 4px; margin-top: 8px; }
    .spark .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
    .spark .col { cursor: pointer; outline: none; }
    .spark .col .b { width: 100%; background: linear-gradient(180deg, var(--accent), var(--sky)); border-radius: 3px 3px 0 0; min-height: 2px; transition: filter .12s; }
    .spark .col .v { font-size: .58rem; font-weight: 700; color: var(--text); }
    .spark .col .d { font-size: .58rem; color: var(--dim); }
    .spark .col:hover .b, .spark .col:focus .b, .spark .col.active .b { filter: brightness(1.25); box-shadow: 0 0 0 2px var(--accent); }
    .sparktip { position: fixed; z-index: 40; background: var(--bg2); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 10px; font-size: .76rem; color: var(--text); white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.45); transform: translate(-50%, calc(-100% - 8px)); pointer-events: none; display: none; }
    .empty { color: var(--dim); font-size: .85rem; padding: 8px 0; }
    /* 💡 자동 코멘트 — 숫자만 보고 "그래서 뭐?"를 매번 손으로 따지던 걸 대신해요 */
    .ins { display: flex; flex-direction: column; gap: 8px; }
    .ins-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
    .ins-row .ico { flex: 0 0 auto; font-size: 1rem; line-height: 1.35; }
    .ins-row .txt { font-size: .87rem; line-height: 1.5; }
    .ins-row .txt b { color: var(--text); }
    .ins-row.warn { border-color: #7a4a2a; }
    .ins-row.warn .txt b { color: #ffb083; }
    .ins-row.good { border-color: #2f6b45; }
    .ins-row.good .txt b { color: #85e3ac; }
    .ins-row .why { display: block; color: var(--dim); font-size: .8rem; margin-top: 3px; }
    .ins-note { color: var(--dim); font-size: .78rem; margin-top: 10px; }
    .setup { border-color: var(--accent); }
    .setup pre { background: #0a0f18; border-radius: 10px; padding: 14px; overflow-x: auto; font-size: .74rem; line-height: 1.6; color: #cfe3ff; margin: 10px 0; white-space: pre; }
    .setup .copy { background: var(--accent); color: #3a2a00; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 700; cursor: pointer; }
    .err { color: var(--bad); font-size: .8rem; }
    .refresh { background: transparent; border: 1px solid var(--line); color: var(--sky); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: .82rem; }
    a.home { color: var(--sky); font-size: .82rem; text-decoration: none; }
    /* 🎉 피버 타임 — 유일하게 **쓰는** 화면이에요 (그 밖은 전부 읽기 전용) */
    .fv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .fv-f { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: var(--dim); }
    .fv-f input { background: #0a0f18; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); font-size: .86rem; font-family: inherit; }
    .fv-now { font-size: .84rem; margin-bottom: 12px; padding: 10px 12px; border-radius: 10px; background: #0a0f18; border: 1px solid var(--line); }
    .fv-now.on { border-color: var(--accent); color: var(--accent); }
    .fv-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    .fv-btns button { border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: .82rem; font-family: inherit; }
    .fv-save { background: var(--accent); color: #3a2a00; border: none; font-weight: 700; }
    .fv-ghost { background: transparent; border: 1px solid var(--line); color: var(--sky); }
    .fv-msg { font-size: .8rem; margin-top: 8px; }
    .fv-hint { font-size: .74rem; color: var(--dim); margin-top: 10px; line-height: 1.6; }
  </style>
</head>
<body>
  <!-- 비밀번호 게이트 -->
  <div id="gate">
    <form id="gate-form" class="gate-box">
      <div class="gate-emoji">🔒</div>
      <h2>통계 대시보드</h2>
      <p class="gate-hint">비밀번호를 입력하세요</p>
      <input id="gate-pw" type="password" autocomplete="current-password" placeholder="비밀번호" />
      <label class="gate-remember"><input type="checkbox" id="gate-remember" checked /> 이 기기에서 기억하기</label>
      <button class="gate-btn" type="submit">들어가기</button>
      <p class="gate-err" id="gate-err"></p>
    </form>
  </div>

  <div class="wrap" id="wrap" hidden>
    <h1>📊 통계 대시보드</h1>
    <p class="sub">키우기 시리즈 · <a class="home" href="../">🎮 게임으로</a> · <button class="refresh" id="refresh">↻ 새로고침</button> · <button class="refresh" id="lockout">🔒 잠그기</button></p>

    <div id="overview"><p class="empty">불러오는 중…</p></div>
    <nav class="tabs" id="tabs" hidden></nav>
    <div id="panel"></div>
  </div>

  <script src="../env.js"></script>
  <script>
    const SUPABASE_URL = "https://dlbpvzgwwcgphlhymncx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsYnB2emd3d2NncGhsaHltbmN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3ODA3MTMsImV4cCI6MjEwMDM1NjcxM30.tyLMO8o_i5OTmKaRudFd5LATDjmjVzL8M2NM_4EoeBc";

    const H = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

    const GAMES = { rookie: "⚾ 더 드래프트", idol: "🎤 더 트레이니", stock: "📈 더 인베스터", soccer: "⚽ 더 윙어", dev: "💻 더 커밋", chef: "🍜 더 셰프", stream: "📺 더 스트리머", unicorn: "🦄 더 유니콘" };

    // ---------- 탭 상태 ----------
    // URL 해시가 단일 진실 원천이에요. 클릭·뒤로가기·링크 진입이 모두 hashchange 한 곳을 타요.
    const GAME_KEYS = Object.keys(GAMES);
    let STATE = null;        // load()가 채우는 fetch 결과 캐시
    let activeGame = null;   // 현재 탭 (GAMES의 키)

    const gameFromHash = () => {
      const raw = location.hash.replace(/^#/, "");
      let h = raw;
      try { h = decodeURIComponent(raw); } catch { /* 잘못된 % 인코딩이면 원문 그대로 봐요 */ }
      return Object.prototype.hasOwnProperty.call(GAMES, h) ? h : GAME_KEYS[0];
    };

    const POS = {
      batter: "타자", pitcher: "투수", vocal: "보컬", dance: "댄스", rap: "랩",
      value: "가치투자", scalp: "단타", news: "정보매매", port: "분산투자",
      fw: "공격수", mf: "미드필더", df: "수비수", wg: "윙어",
      front: "프론트엔드", back: "백엔드", ai: "AI·데이터", devops: "데브옵스",
      korean: "한식", western: "양식", dessert: "디저트", chinese: "중식",
      game: "게임 방송", talk: "토크", variety: "예능·챌린지", irl: "야외·일상",
    };
    // 예전 id로 저장된 선택값을 읽기 좋은 이름으로 합쳐요 (id↔이름 혼재 방지)
    /* 선택지 표시 이름. **id → 이름**과 **옛 이름 → 지금 이름** 둘 다 여기서 접어요.
     *
     * ⚠️ 로그에 표시 이름을 남겨 온 게 화근이에요. 이름을 바꾸는 순간 같은 선택지가
     * 옛 이름·새 이름으로 **쪼개져** 보입니다. 실제로 축구 유스를 나라에 맞추면서
     * 배경 분포가 9줄로 갈라졌어요(유럽 아카데미 64 / 이탈리아 유스 2 …).
     * 과거 데이터는 못 고치니 여기서 접고, 앞으로는 게임이 **id를 함께** 남겨요. */
    const CHOICE_ALIAS = {
      seoul: "서울", gyeongin: "인천·경기", chungcheong: "대전·충청",
      honam: "광주·전라", daegu: "대구·경북", busan: "부산·경남",
      sw: "SW엔터", onlyone: "온리원컴퍼니", luna: "루나엔터", byeol: "별빛엔터", garage: "개러지뮤직",
      kospi: "국장", us: "미장", jp: "일본장",

      /* ⚽ 유스 — 2.33.0에서 권역(유럽·아프리카)을 나라로 좁혔어요.
       * 왼쪽이 로그에 쌓여 있는 값(옛 이름 또는 id), 오른쪽이 지금 이름이에요. */
      k: "K리그 유스",
      jp_youth: "J리그 유스", "일본 J리그 유스": "J리그 유스",
      br: "브라질 유스", "남미 유스": "브라질 유스",
      af: "잉글랜드 아카데미", "아프리카 유망주": "잉글랜드 아카데미",
      eu: "이탈리아 유스", "유럽 아카데미": "이탈리아 유스",
      "국내 유스": "K리그 유스",
    };
    const normChoice = (c) => CHOICE_ALIAS[c] || c;
    /* ⚠️ 여기에 없는 이벤트는 **영문 그대로** 뜨고, FUNNEL_ORDER에도 없으면
     * indexOf가 -1이라 **맨 앞으로** 밀려요. 새 이벤트를 남길 때 둘 다 채워야 합니다.
     * 실제로 transfer·rebirth·tour가 오래 빠져 있었어요. */
    const EVENT_LABEL = {
      visit: "방문", new_player: "새 캐릭터", draft: "드래프트", ending: "서바이벌 결과",
      pro_enter: "프로 입단", debut: "데뷔", season_end: "시즌 결산", year_end: "연말 결산",
      retire: "은퇴", battle: "배틀", bonus: "보너스",
      pwa_install: "📲 앱 설치", pwa_launch: "📲 앱 실행",
      exit: "🚀 Exit(재창업)", decacorn: "👑 데카콘 달성",
      youth_round: "🎓 유스 라운드", cup: "🏆 컵 대회", promo: "🔺 승격·강등",
      awaken: "🔮 재능 각성", help: "❓ 도움말 열기", error: "💥 오류",
      transfer: "💼 이적", tour: "🌏 월드투어", rebirth: "♻️ 환생",
    };

    async function getView(name) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${name}?select=*`, { headers: H });
      if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
      return res.json();
    }

    const bar = (label, val, max, cls = "") =>
      `<div class="bar-row"><div class="bar-label">${esc(label)}</div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${max ? Math.max(2, (val / max) * 100) : 2}%"></div>
        <span class="bar-val">${val.toLocaleString()}</span></div></div>`;

    // 배경 분포 + 포지션 분포를 한 문자열로 돌려줘요. 데이터가 없으면 빈 문자열이에요.
    function choiceSection(rows, game) {
      const g = rows.filter((r) => r.game === game && r.choice);
      if (!g.length) return "";

      const agg = {};
      for (const r of g) { const c = normChoice(r.choice); agg[c] = (agg[c] || 0) + r.n; }
      const items = Object.entries(agg).sort((a, b) => b[1] - a[1]);
      const max = items[0][1];
      let html = `<section><h2>🗺️ 배경 선택 분포</h2>${items.map(([k, v]) => bar(k, v, max)).join("")}</section>`;

      const pos = {};
      for (const r of g) if (r.pos) pos[r.pos] = (pos[r.pos] || 0) + r.n;
      const pi = Object.entries(pos).sort((a, b) => b[1] - a[1]);
      if (pi.length) {
        const pmax = pi[0][1];
        html += `<section><h2>🧢 포지션 분포</h2>${pi.map(([k, v]) => bar(POS[k] || k, v, pmax)).join("")}</section>`;
      }
      return html;
    }

    /* 🌍 리그 이름 — 게임 소스의 LEAGUES와 **id로** 맞춰요.
     * 이름을 키로 쓰면 리그 이름을 바꿀 때마다 통계가 갈라져요(유스에서 겪었어요).
     * id는 옛 세이브가 가리키는 값이라 안 바뀝니다. */
    const LEAGUE_NAME = {
      soccer: {
        5: "🇰🇷 K리그3", 4: "🇰🇷 K리그2", 1: "🇰🇷 K리그1",
        6: "🇯🇵 J2리그", 7: "🇯🇵 J1리그",
        8: "🇧🇷 브라질 세리에B", 9: "🇧🇷 브라질 세리에A",
        10: "🇮🇹 세리에B", 11: "🇮🇹 세리에A",
        2: "🇬🇧 챔피언십", 3: "🇬🇧 프리미어리그",
      },
      rookie: { 1: "🇰🇷 KBO", 2: "🇯🇵 열도 리그", 3: "🗽 대륙 리그" },
    };
    /* 사다리 순서 — 위로 갈수록 어려운 리그예요. 표를 이 순서로 그려야
     * "어디까지 올라갔나"가 한눈에 읽혀요(많은 순으로 그리면 사다리가 안 보여요). */
    const LEAGUE_ORDER = {
      soccer: [5, 4, 1, 6, 8, 7, 9, 10, 2, 11, 3],
      rookie: [1, 2, 3],
    };

    /* 어느 리그에서 뛰었나(시즌 수) · 어디까지 갔나(은퇴 시점 리그).
     * 뷰가 없으면 아무것도 안 그려요 — 설정 안내는 전체 화면이 맡아요. */
    function leagueSection(rows, game) {
      const names = LEAGUE_NAME[game];
      if (!rows || !names) return "";
      const mine = rows.filter((r) => r.game === game && names[r.lg]);
      if (!mine.length) return "";
      const order = LEAGUE_ORDER[game] || Object.keys(names).map(Number);

      const pickBy = (evs) => {
        const agg = {};
        for (const r of mine) if (evs.includes(r.event)) agg[r.lg] = (agg[r.lg] || 0) + r.n;
        return agg;
      };
      const seasons = pickBy(["year_end", "season_end"]);
      const ends = pickBy(["retire"]);

      let html = "";
      const sTotal = Object.values(seasons).reduce((a, b) => a + b, 0);
      if (sTotal) {
        const max = Math.max(...Object.values(seasons));
        html += `<section><h2>🌍 어느 리그에서 뛰었나</h2>${
          order.filter((id) => seasons[id]).map((id) =>
            bar(`${names[id]} ${fmtPct(pct(seasons[id], sTotal))}`, seasons[id], max)).join("")
        }<p class="ins-note">치른 시즌 수예요. 사다리 아래에서 위 순서로 놓았어요 — 총 ${sTotal.toLocaleString()}시즌</p></section>`;
      }
      const eTotal = Object.values(ends).reduce((a, b) => a + b, 0);
      if (eTotal) {
        const max = Math.max(...Object.values(ends));
        const top = order.filter((id) => ends[id]);
        const highest = top[top.length - 1];
        html += `<section><h2>🏁 어디까지 갔나 (은퇴 시점)</h2>${
          top.map((id) => bar(`${names[id]} ${fmtPct(pct(ends[id], eTotal))}`, ends[id], max)).join("")
        }<p class="ins-note">은퇴한 ${eTotal.toLocaleString()}명 기준. 가장 높이 간 리그는 <b>${names[highest]}</b>예요.</p></section>`;
      }
      return html;
    }

    // 퍼널 막대의 표시 순서예요.
    /* 커리어가 흘러가는 순서예요 — 방문 → 시작 → 유스 → 데뷔 → 시즌 → 은퇴.
     * 여기 없는 이벤트는 맨 앞으로 밀리니 새로 남길 때 꼭 끼워 넣어요. */
    const FUNNEL_ORDER = ["visit", "pwa_install", "pwa_launch", "new_player", "draft", "youth_round",
      "ending", "debut", "pro_enter", "season_end", "year_end", "cup", "promo", "transfer", "tour",
      "exit", "decacorn", "retire", "rebirth", "battle", "bonus", "awaken", "help", "error"];

    /* ─────────────────────────────────────────────────────────────
     * 💡 자동 코멘트
     *
     * 숫자만 늘어놓으면 볼 때마다 "그래서 뭐가 문제지?"를 손으로 따져야 해요.
     * 전환율·쏠림·추세를 계산해서 **판단과 근거를 문장으로** 답니다.
     *
     * 지키는 것 셋:
     *  ① **문턱은 시리즈 평균에서 뽑아요.** 절대값(예: "완주율 20% 미만이면 나쁨")을
     *     박아 두면 게임 성격이 달라질 때마다 거짓말을 해요. "다른 게임보다 낮다"는
     *     항상 말이 됩니다.
     *  ② **표본이 적으면 판단을 접어요.** 3명 보고 "이탈이 심각합니다"라고 하면
     *     그 코멘트 전체를 안 믿게 돼요. 대신 "아직 표본이 적어요"라고 적습니다.
     *  ③ **근거를 같이 적어요.** 분자·분모를 보여주지 않으면 확인할 방법이 없어요.
     * ───────────────────────────────────────────────────────────── */
    const MIN_N = 20;                   // 이만큼은 모여야 판단해요
    const pct = (a, b) => (b ? (a / b) * 100 : 0);
    const fmtPct = (v) => `${v.toFixed(0)}%`;

    // 게임 하나의 기본 지표
    function metricsOf(summary, game) {
      const get = (ev, key) => {
        const r = summary.find((x) => x.game === game && x.event === ev);
        return r ? r[key] : 0;
      };
      const visitors = get("visit", "players");
      const started = get("new_player", "total");
      const retired = get("retire", "total");
      const battled = get("battle", "players");
      return {
        game, visitors, started, retired, battled,
        startRate: pct(started, visitors),      // 방문자가 실제로 시작하나
        finishRate: pct(retired, started),      // 시작한 캐릭터가 끝까지 가나
        battleRate: pct(battled, visitors),     // 대전 기능이 쓰이나
        revisit: get("visit", "total") / (visitors || 1),  // 방문 일수 / 사람
      };
    }

    const row = (kind, ico, txt, why) =>
      `<div class="ins-row ${kind}"><span class="ico">${ico}</span><span class="txt">${txt}`
      + `${why ? `<span class="why">${why}</span>` : ""}</span></div>`;

    /* 시리즈 평균과 견줘 한 줄. 표본이 모자라면 null을 돌려줘요(줄을 안 그려요). */
    function compareLine(label, mine, avg, n, opts) {
      const o = opts || {};
      if (n < MIN_N) return null;
      const gap = mine - avg;
      const big = Math.abs(gap) >= (o.big || 10);
      if (!big) {
        return row("", "➖", `${label} <b>${fmtPct(mine)}</b> — 시리즈 평균(${fmtPct(avg)})과 비슷해요`,
          o.why);
      }
      const better = o.lowerIsBetter ? gap < 0 : gap > 0;
      return row(better ? "good" : "warn", better ? "🟢" : "🟠",
        `${label} <b>${fmtPct(mine)}</b> — 시리즈 평균 ${fmtPct(avg)}보다 `
        + `<b>${Math.abs(gap).toFixed(0)}%p ${gap > 0 ? "높아요" : "낮아요"}</b>`,
        o.why);
    }

    /* 선택 쏠림 — 고를 게 여럿인데 하나로 몰리면 나머지가 장식이에요. */
    function skewLine(choices, game, key, label) {
      const rows = choices.filter((r) => r.game === game && r[key]);
      if (!rows.length) return null;
      const byKey = {};
      // 배경은 옛 이름을 접어서 세요 — 안 그러면 "몰렸다/고르다"가 통째로 틀려요
      for (const r of rows) {
        const k = key === "choice" ? normChoice(r[key]) : (POS[r[key]] || r[key]);
        byKey[k] = (byKey[k] || 0) + r.n;
      }
      const list = Object.entries(byKey).sort((a, b) => b[1] - a[1]);
      const total = list.reduce((a, x) => a + x[1], 0);
      if (total < MIN_N || list.length < 2) return null;
      const [topName, topN] = list[0];
      const [lowName, lowN] = list[list.length - 1];
      const share = pct(topN, total), even = 100 / list.length;
      const detail = `${list.map(([k, v]) => `${k} ${fmtPct(pct(v, total))}`).join(" · ")} (표본 ${total})`;
      // 고르게 갈리면 2배, 몰리면 그 이상. 선택지 수에 맞춰 문턱이 자동으로 움직여요
      if (share >= even * 2) {
        return row("warn", "🟠",
          `${label}이 <b>${topName}</b>에 몰려 있어요 — ${fmtPct(share)} (고르게면 ${fmtPct(even)})`,
          `${detail} · 가장 안 고르는 건 ${lowName} ${fmtPct(pct(lowN, total))}`);
      }
      return row("good", "🟢", `${label}은 고르게 갈려요 — 1위 ${topName} ${fmtPct(share)}`, detail);
    }

    /* 최근 추세 — 같은 길이의 앞뒤 구간을 견줘요. */
    function trendLine(daily, game) {
      const rows = daily.filter((r) => (game ? r.game === game : true));
      if (!rows.length) return null;
      const byDay = {};
      for (const r of rows) byDay[r.day] = (byDay[r.day] || 0) + (r.visits || 0);
      const days = Object.keys(byDay).sort();
      if (days.length < 6) return null;                  // 3+3일은 돼야 견줄 만해요
      const half = Math.min(7, Math.floor(days.length / 2));
      const recent = days.slice(-half).reduce((a, d) => a + byDay[d], 0);
      const before = days.slice(-half * 2, -half).reduce((a, d) => a + byDay[d], 0);
      if (before < MIN_N) return null;
      const chg = pct(recent - before, before);
      const label = `최근 ${half}일 방문 <b>${recent}</b> · 그 전 ${half}일 <b>${before}</b>`;
      if (Math.abs(chg) < 15) return row("", "➖", `${label} — 거의 그대로예요 (${chg > 0 ? "+" : ""}${chg.toFixed(0)}%)`);
      return row(chg > 0 ? "good" : "warn", chg > 0 ? "📈" : "📉",
        `${label} — <b>${chg > 0 ? "+" : ""}${chg.toFixed(0)}%</b>`);
    }

    function insightSection(state, game) {
      const all = GAME_KEYS.map((g) => metricsOf(state.summary, g)).filter((m) => m.visitors >= MIN_N);
      if (!all.length) {
        return `<section><h2>💡 코멘트</h2><p class="empty">아직 판단할 만큼 데이터가 안 모였어요 (게임당 방문자 ${MIN_N}명부터 봐요).</p></section>`;
      }
      const avg = (k) => all.reduce((a, m) => a + m[k], 0) / all.length;
      const lines = [];

      if (!game) {
        // ── 전체 화면: 게임끼리 견줘요
        const byStart = all.slice().sort((a, b) => b.startRate - a.startRate);
        const byFinish = all.filter((m) => m.started >= MIN_N).sort((a, b) => b.finishRate - a.finishRate);
        lines.push(trendLine(state.daily, null));
        if (byStart.length >= 2) {
          const hi = byStart[0], lo = byStart[byStart.length - 1];
          lines.push(row(lo.startRate < avg("startRate") - 10 ? "warn" : "", "🎬",
            `방문자가 실제로 시작하는 비율 — 가장 높은 건 <b>${GAMES[hi.game]} ${fmtPct(hi.startRate)}</b>, `
            + `가장 낮은 건 <b>${GAMES[lo.game]} ${fmtPct(lo.startRate)}</b>`,
            `평균 ${fmtPct(avg("startRate"))} · 낮은 쪽은 첫 화면에서 뭘 하는 게임인지 안 읽히는지 봐야 해요`));
        }
        if (byFinish.length >= 2) {
          const hi = byFinish[0], lo = byFinish[byFinish.length - 1];
          lines.push(row(lo.finishRate < avg("finishRate") - 10 ? "warn" : "", "🏁",
            `시작한 캐릭터가 은퇴까지 가는 비율 — <b>${GAMES[hi.game]} ${fmtPct(hi.finishRate)}</b> ↔ `
            + `<b>${GAMES[lo.game]} ${fmtPct(lo.finishRate)}</b>`,
            `평균 ${fmtPct(avg("finishRate"))} · 낮으면 중간에 지루하거나 벽이 있다는 뜻이에요`));
        }
        const revisitLow = all.filter((m) => m.revisit < 1.15);
        if (revisitLow.length) {
          lines.push(row("warn", "🔁",
            `재방문이 거의 없는 게임 — ${revisitLow.map((m) => `<b>${GAMES[m.game]}</b> ${m.revisit.toFixed(2)}회`).join(" · ")}`,
            `1.00이면 "한 번 열고 다시 안 옴"이에요. 시리즈 평균 ${avg("revisit").toFixed(2)}회`));
        }
      } else {
        // ── 게임 화면: 시리즈 평균과 견줘요
        const m = metricsOf(state.summary, game);
        if (m.visitors < MIN_N) {
          lines.push(row("", "⏳", `아직 표본이 적어요 — 방문자 <b>${m.visitors}명</b>`,
            `${MIN_N}명부터 판단해요. 적은 표본으로 단정하면 코멘트 전체를 못 믿게 돼요.`));
        } else {
          lines.push(trendLine(state.daily, game));
          lines.push(compareLine("시작 전환율", m.startRate, avg("startRate"), m.visitors,
            { why: `방문 ${m.visitors}명 중 ${m.started}개 캐릭터 생성` }));
          lines.push(compareLine("은퇴까지 완주", m.finishRate, avg("finishRate"), m.started,
            { why: `시작 ${m.started} · 은퇴 ${m.retired}` }));
          lines.push(compareLine("대전 이용", m.battleRate, avg("battleRate"), m.visitors,
            { why: `방문자 ${m.visitors}명 중 ${m.battled}명이 대전을 해봤어요` }));
          lines.push(skewLine(state.choices, game, "choice", "시작 선택"));
          lines.push(skewLine(state.choices, game, "pos", "포지션·보직"));
        }
      }

      const body = lines.filter(Boolean).join("");
      if (!body) {
        return `<section><h2>💡 코멘트</h2><p class="empty">견줄 만한 게 아직 없어요 — 표본이 더 모이면 여기에 적어요.</p></section>`;
      }
      return `<section><h2>💡 코멘트</h2><div class="ins">${body}</div>`
        + `<p class="ins-note">문턱은 <b>시리즈 평균</b>에서 뽑아요 — 절대값을 박아 두면 게임 성격이 달라질 때마다 거짓말을 해요. `
        + `표본 ${MIN_N} 미만이면 판단을 접습니다.</p></section>`;
    }

    function funnelSection(rows, hofByGame, game) {
      const g = rows.filter((r) => r.game === game);
      if (!g.length) return "";
      g.sort((a, b) => FUNNEL_ORDER.indexOf(a.event) - FUNNEL_ORDER.indexOf(b.event));
      const max = Math.max(...g.map((r) => r.total));
      const hofN = hofByGame ? (hofByGame[game] || 0) : null;
      return `<section class="funnel"><h2>📈 이벤트별 발생${hofN != null ? ` · 🏛️명전 ${hofN}명` : ""}</h2>${
        g.map((r) => bar(EVENT_LABEL[r.event] || r.event, r.total, max)).join("")
      }</section>`;
    }

    // 🦄 더 유니콘 — 방치형이라 지표가 달라요 (포지션 대신 Exit·스톡옵션·최고 단계)
    const UNI_STAGES = ["부트스트랩", "프리시드", "시드 투자", "시리즈 A", "시리즈 B", "시리즈 C", "유니콘", "데카콘"];
    function unicornSection(hofRows) {
      if (!hofRows) return "";
      const es = hofRows.filter((r) => r.game === "unicorn" && r.data).map((r) => r.data);
      if (!es.length) return "";   // 빈 상태 안내는 renderPanel의 emptyCard가 맡아요

      const num = (v) => (typeof v === "number" && isFinite(v) ? v : 0);
      const deca = es.filter((e) => e.stage === "데카콘").length;
      const best = es.reduce((a, b) => (num(b.score) > num(a.score) ? b : a));
      const avgExit = es.reduce((s, e) => s + num(e.exits), 0) / es.length;
      const maxSo = Math.max(...es.map((e) => num(e.so)));

      let html = `<section><h2>🏢 창업가 기록</h2>
        <div class="kpis">
          <div class="kpi"><div class="n">${es.length.toLocaleString()}</div><div class="l">🏛️ 은퇴 창업가</div></div>
          <div class="kpi"><div class="n">${deca.toLocaleString()}</div><div class="l">👑 데카콘 달성</div></div>
          <div class="kpi"><div class="n">${avgExit.toFixed(1)}</div><div class="l">🚀 평균 Exit</div></div>
          <div class="kpi"><div class="n">${maxSo.toLocaleString()}</div><div class="l">🧾 최고 스톡옵션</div></div>
        </div></section>`;

      // 최고 단계 분포
      const byStage = {};
      for (const e of es) byStage[e.stage || "-"] = (byStage[e.stage || "-"] || 0) + 1;
      const si = UNI_STAGES.filter((s) => byStage[s]).map((s) => [s, byStage[s]]);
      if (si.length) {
        const smax = Math.max(...si.map((x) => x[1]));
        html += `<section><h2>📊 최고 단계 분포</h2>${si.map(([k, v]) => bar(k, v, smax)).join("")}</section>`;
      }

      // Exit 횟수 분포
      const byExit = {};
      for (const e of es) { const k = num(e.exits) >= 4 ? "4회 이상" : `${num(e.exits)}회`; byExit[k] = (byExit[k] || 0) + 1; }
      const order = ["0회", "1회", "2회", "3회", "4회 이상"];
      const ei = order.filter((k) => byExit[k]).map((k) => [k, byExit[k]]);
      if (ei.length) {
        const emax = Math.max(...ei.map((x) => x[1]));
        html += `<section><h2>🚀 Exit 횟수 분포</h2>${ei.map(([k, v]) => bar(k, v, emax)).join("")}</section>`;
      }

      // 상위 기록
      const top = [...es].sort((a, b) => num(b.score) - num(a.score)).slice(0, 5);
      const tmax = num(top[0].score);
      html += `<section><h2>🏆 최고 기록 TOP ${top.length}</h2>${
        top.map((e, i) => bar(`${i + 1}. ${e.name || "-"} (${e.stage || "-"} · Exit ${num(e.exits)}회)`, num(e.score), tmax)).join("")
      }<p class="empty" style="margin-top:8px">최고 기록: ${esc(best.name || "-")} · ${esc(best.grade || "-")}</p></section>`;
      return html;
    }

    // game이 null이면 전 게임 합산(#overview), 게임 키면 그 게임만(#panel)이에요.
    function dailySection(rows, game) {
      const src = game ? rows.filter((r) => r.game === game) : rows;
      const byDay = {};
      for (const r of src) {
        byDay[r.day] = byDay[r.day] || { visits: 0, np: 0 };
        byDay[r.day].visits += r.visits || 0;
        byDay[r.day].np += r.new_players || 0;
      }
      const days = Object.keys(byDay).sort().slice(-14);
      if (!days.length) return "";
      const max = Math.max(...days.map((d) => byDay[d].visits), 1);
      const title = game
        ? "📅 방문 추이 (일별 순 방문 기기)"
        : "📅 최근 방문 추이 (전 게임 합산 · 일별 순 방문 기기)";
      return `<section><h2>${title}</h2>
        <p class="empty" style="margin:-6px 0 10px">막대를 누르거나 마우스를 올리면 상세 숫자를 볼 수 있어요</p>
        <div class="spark">${days.map((d) => {
          const v = byDay[d].visits;
          const np = byDay[d].np;
          const md = d.slice(5);
          const [, mo, da] = d.split("-");
          const h = Math.max(3, Math.round((v / max) * 90));
          const info = `${+mo}월 ${+da}일 · 방문 ${v}명 · 새 캐릭터 ${np}명`;
          return `<div class="col" tabindex="0" data-info="${info}"><div class="v">${v}</div><div class="b" style="height:${h}px"></div><div class="d">${md}</div></div>`;
        }).join("")}</div></section>`;
    }

    const SETUP_SQL = `-- Supabase SQL Editor에서 1회 실행 (집계 전용 읽기 뷰)
create or replace view public.stats_summary as
  select game, event, count(*)::int total, count(distinct player)::int players
  from public.events group by game, event;

create or replace view public.stats_choices as
  select game, coalesce(data->>'region', data->>'agency') choice,
    data->>'pos' pos, count(*)::int n
  from public.events where event = 'new_player'
  group by 1, 2, 3;

create or replace view public.stats_daily as
  select game,
    (ts at time zone 'Asia/Seoul')::date as "day",
    count(*) filter (where event = 'visit') as visits,
    count(*) filter (where event = 'new_player') as new_players
  from public.events group by 1, 2;

-- 🌍 리그 분포 — 어느 리그에서 몇 시즌을 뛰었고, 어디까지 갔나
create or replace view public.stats_league as
  select game, event, (data->>'lg')::int lg,
    count(*)::int n, count(distinct player)::int players
  from public.events
  where event in ('year_end', 'season_end', 'retire') and data ? 'lg'
  group by 1, 2, 3;

grant select on public.stats_summary, public.stats_choices, public.stats_daily, public.stats_league to anon;`;

    function setupCard(msg) {
      return `<section class="setup"><h2>⚙️ 통계 뷰 설정이 필요해요</h2>
        <p class="empty">${msg} 아래 SQL을 Supabase → SQL Editor에서 한 번만 실행하면 여기에 통계가 떠요.</p>
        <pre id="sql">${esc(SETUP_SQL)}</pre>
        <button class="copy" id="copysql">📋 SQL 복사</button></section>`;
    }

    // 명예의 전당 실제 등록 인원 (hof 테이블 직접 조회 — 읽기 정책 open)
    async function getHof() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/hof?select=game,data&limit=5000`, { headers: H });
        if (!res.ok) return null;
        return res.json();
      } catch { return null; }
    }

    function emptyCard(game) {
      return `<section><h2>${GAMES[game]}</h2><p class="empty">아직 수집된 데이터가 없어요.<br>플레이어가 새 캐릭터를 만들면 여기에 분포와 퍼널이 뜨기 시작해요.</p></section>`;
    }

    // 전역 KPI + 합산 방문 추이 — 탭과 무관하게 항상 보여요.
    function renderOverview() {
      if (!STATE) return;
      const summary = STATE.summary;
      const totalVisits = summary.filter((r) => r.event === "visit").reduce((a, r) => a + r.players, 0);
      const totalNew = summary.filter((r) => r.event === "new_player").reduce((a, r) => a + r.total, 0);
      const totalBattle = summary.filter((r) => r.event === "battle").reduce((a, r) => a + r.total, 0);
      const totalRetire = summary.filter((r) => r.event === "retire").reduce((a, r) => a + r.total, 0);
      const totalInstall = summary.filter((r) => r.event === "pwa_install").reduce((a, r) => a + r.total, 0);
      const totalPwaUsers = summary.filter((r) => r.event === "pwa_launch").reduce((a, r) => a + r.players, 0);
      const hofTotal = STATE.hofTotal;

      let html = `<div class="kpis">
        <div class="kpi"><div class="n">${totalVisits.toLocaleString()}</div><div class="l">순 방문자</div></div>
        <div class="kpi"><div class="n">${totalNew.toLocaleString()}</div><div class="l">새 캐릭터</div></div>
        <div class="kpi"><div class="n">${totalInstall.toLocaleString()}</div><div class="l">📲 앱 설치 수</div></div>
        <div class="kpi"><div class="n">${totalPwaUsers.toLocaleString()}</div><div class="l">📲 앱으로 실행</div></div>
        <div class="kpi"><div class="n">${totalBattle.toLocaleString()}</div><div class="l">배틀 횟수</div></div>
        <div class="kpi"><div class="n">${totalRetire.toLocaleString()}</div><div class="l">은퇴 이벤트</div></div>
        ${hofTotal != null ? `<div class="kpi"><div class="n">${hofTotal.toLocaleString()}</div><div class="l">🏛️ 명예의 전당</div></div>` : ""}
      </div>
      ${hofTotal != null && hofTotal !== totalRetire
        ? `<p class="empty" style="margin:-12px 0 20px">ℹ️ 은퇴 이벤트(${totalRetire})는 통계 도입 이후 집계, 명예의 전당(${hofTotal})은 전체 은퇴자 명단이라 숫자가 달라요.</p>`
        : ""}
      ${totalInstall !== totalPwaUsers
        ? `<p class="empty" style="margin:-12px 0 20px">ℹ️ 앱 설치(${totalInstall})는 <b>안드로이드·PC에서만</b> 잡혀요 — 아이폰은 '홈 화면에 추가'를 해도 브라우저가 설치 이벤트를 주지 않아요. 앱으로 실행(${totalPwaUsers})은 <b>게임별로</b> 세서, 한 사람이 여러 게임을 설치하면 그만큼 더해집니다. 그래서 실행이 설치보다 클 수 있어요.</p>`
        : ""}`;

      html += insightSection(STATE, null);
      html += dailySection(STATE.daily, null);

      if (!summary.length) html = setupCard("뷰는 있는데 아직 수집된 데이터가 없어요.") + html;
      $("overview").innerHTML = html;
      wireCopy();
    }

    function renderTabs() {
      if (!STATE) { $("tabs").hidden = true; $("tabs").innerHTML = ""; return; }
      $("tabs").innerHTML = GAME_KEYS.map((g) =>
        `<button type="button" class="tab${g === activeGame ? " on" : ""}" data-game="${g}"${g === activeGame ? ' aria-current="true"' : ""}>${GAMES[g]}</button>`
      ).join("");
      // 해시로 오른쪽 끝 탭에 바로 들어오면 칩이 스크롤 밖에 있어요.
      const on = $("tabs").querySelector(".tab.on");
      if (on) {
        // scrollIntoView는 문서까지 세로로 밀어 KPI를 지나쳐요. 탭 바 안에서 가로 위치만 맞춰요.
        const tabsBar = $("tabs");
        tabsBar.scrollLeft = on.offsetLeft - (tabsBar.clientWidth - on.offsetWidth) / 2;
      }
    }

    function renderPanel() {
      if (!STATE) { $("panel").innerHTML = ""; return; }
      const game = activeGame;
      const parts = [
        feverSection(game),
        insightSection(STATE, game),
        leagueSection(STATE.league, game),
        dailySection(STATE.daily, game),
        choiceSection(STATE.choices, game),
        game === "unicorn" ? unicornSection(STATE.hofRows) : "",
        funnelSection(STATE.summary, STATE.hofByGame, game),
      ];
      $("panel").innerHTML = parts.join("").trim() || emptyCard(game);
      wireFever(game);
    }

    // ---------- 🎉 피버 타임 (⚽ 더 윙어 전용) ----------
    /* 이 대시보드에서 **유일하게 쓰는** 자리예요. 나머지는 전부 읽기 전용입니다.
     *
     * 쓰기는 `fever` 테이블에 직접 꽂지 않고 `fever_set` RPC 하나로만 들어가요.
     * 그 RPC가 관리 비밀번호를 봅니다 — 공개 anon 키만으로는 아무도 이벤트를
     * 열 수 없어요(테이블에 INSERT/UPDATE 정책이 아예 없습니다).
     * 이 페이지의 게이트 비번과 **다른 비번**이에요. 읽는 문이 열려도 쓰는 문은
     * 따로 잠겨 있어야 해요. */
    const FEVER_GAME = "soccer";
    const FEVER_ID = "soccer-fever";
    /* [키, 이름, 단위, **화면 숫자 ÷ 이 값 = 게임이 쓰는 값**]
     *
     * ⚠️ 넣는 쪽과 빼는 쪽이 같은 자를 써야 해요. 처음엔 빼는 쪽만 `mul * 100`으로
     * 나눠서, 훈련 30(%)을 저장하면 0.003이 되고 다시 열면 0.3으로 보였습니다(제보).
     * 이제 이 값 하나만 봐요 — 두 자리에 다른 식이 있으면 반드시 어긋나요. */
    const FEVER_EFFS = [
      ["train", "훈련 상승폭", "%", 100],
      ["moment", "승부처 성공", "%p", 100],
      ["g", "골", "%", 100],
      ["a", "도움", "%", 100],
      ["d", "수비", "%", 100],
      ["rate", "경기 평점", "점", 1],
    ];
    // 화면 ↔ 저장값. 소수 둘째 자리까지만 남겨요(0.30000000000000004 방지)
    const toField = (v, mul) => Math.round((v || 0) * mul * 100) / 100;
    const toBoost = (v, mul) => Math.round((Number(v) / mul) * 10000) / 10000;
    let FEVER_ROW = null;

    /* datetime-local은 **로컬 시각 문자열**이에요. 표준시로 바꿔 보내고,
     * 받을 때는 다시 로컬로 되돌려요 — 이 변환을 빠뜨리면 9시간이 밀립니다. */
    const toLocalInput = (iso) => {
      const d = new Date(iso);
      if (isNaN(d)) return "";
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const fmtWhen = (iso) => {
      const d = new Date(iso);
      return isNaN(d) ? "?" : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    };

    function feverSection(game) {
      if (game !== FEVER_GAME) return "";
      const r = FEVER_ROW;
      const now = Date.now();
      let state = `<div class="fv-now">지금 열린 이벤트가 없어요.</div>`;
      if (r) {
        const from = Date.parse(r.starts_at), to = Date.parse(r.ends_at);
        const live = now >= from && now < to;
        state = `<div class="fv-now${live ? " on" : ""}">`
          + `${live ? "🔴 진행 중" : now < from ? "🕒 예정" : "⚪ 끝난 이벤트"} — `
          + `<b>${esc(r.emoji || "🎉")} ${esc(r.title || "")}</b> · ${fmtWhen(r.starts_at)} ~ ${fmtWhen(r.ends_at)}`
          + `</div>`;
      }
      const eff = (r && r.boost) || {};
      const field = (id, label, val, type) =>
        `<label class="fv-f">${label}<input id="${id}" type="${type}" value="${val}" /></label>`;
      return `<section>
        <h2>🎉 피버 타임</h2>
        ${state}
        <div class="fv-grid">
          ${field("fv-title", "제목", esc((r && r.title) || "주말 피버 타임"), "text")}
          ${field("fv-emoji", "이모지", esc((r && r.emoji) || "🎉"), "text")}
          ${field("fv-note", "한 줄 설명", esc((r && r.note) || ""), "text")}
          ${field("fv-from", "시작", toLocalInput((r && r.starts_at) || new Date().toISOString()), "datetime-local")}
          ${field("fv-to", "종료", toLocalInput((r && r.ends_at) || new Date(Date.now() + 864e5).toISOString()), "datetime-local")}
        </div>
        <div class="fv-grid" style="margin-top:10px">
          ${FEVER_EFFS.map(([k, label, unit, mul]) =>
            field(`fv-e-${k}`, `${label} (${unit})`, toField(eff[k], mul), "number")).join("")}
        </div>
        <div class="fv-btns">
          ${field("fv-pw", "관리 비밀번호", "", "password")}
          <button type="button" class="fv-save" id="fv-save">저장</button>
          <button type="button" class="fv-ghost" id="fv-24">지금부터 24시간</button>
          <button type="button" class="fv-ghost" id="fv-off">지금 끄기</button>
        </div>
        <p class="fv-msg" id="fv-msg"></p>
        <p class="fv-hint">효과는 <b>0이면 안 붙어요.</b> 게임 쪽에서 한 번 더 상한을 걸어요
          (훈련 +100% · 골·도움·수비 +50% · 승부처 +15%p · 평점 +0.6).<br/>
          플레이어에게는 접속할 때, 그리고 <b>화면이 바뀔 때마다</b> 다시 확인돼요 —
          이미 켜 둔 사람에게도 다음 화면에서 배너가 뜹니다.</p>
      </section>`;
    }

    async function loadFever() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/fever?id=eq.${FEVER_ID}&select=*`, { headers: H });
        FEVER_ROW = res.ok ? ((await res.json())[0] || null) : null;
      } catch { FEVER_ROW = null; }
    }

    async function feverRpc(fn, body) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
        method: "POST",
        headers: { ...H, "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (res.ok) return null;
      let msg = `HTTP ${res.status}`;
      try { msg = (await res.json()).message || msg; } catch { /* 본문이 없을 수도 있어요 */ }
      return msg;
    }

    function wireFever(game) {
      if (game !== FEVER_GAME || !$("fv-save")) return;
      const msg = (t, bad) => { $("fv-msg").textContent = t; $("fv-msg").style.color = bad ? "var(--bad)" : "var(--accent)"; };
      $("fv-24").onclick = () => {
        const now = new Date();
        $("fv-from").value = toLocalInput(now.toISOString());
        $("fv-to").value = toLocalInput(new Date(now.getTime() + 864e5).toISOString());
      };
      $("fv-save").onclick = async () => {
        const pw = $("fv-pw").value;
        if (!pw) return msg("관리 비밀번호를 넣어주세요", true);
        const from = $("fv-from").value, to = $("fv-to").value;
        if (!from || !to) return msg("시작과 종료를 정해주세요", true);
        const boost = {};
        for (const [k, , , mul] of FEVER_EFFS) {
          const v = toBoost($(`fv-e-${k}`).value, mul);
          if (Number.isFinite(v) && v > 0) boost[k] = v;
        }
        msg("저장하는 중…");
        const err = await feverRpc("fever_set", {
          p_pw: pw, p_id: FEVER_ID, p_game: FEVER_GAME,
          p_emoji: $("fv-emoji").value || "🎉", p_title: $("fv-title").value || "피버 타임",
          p_note: $("fv-note").value || null,
          p_starts: new Date(from).toISOString(), p_ends: new Date(to).toISOString(),
          p_boost: boost,
        });
        if (err) return msg(`저장 못 했어요 — ${err}`, true);
        await loadFever();
        renderPanel();
        $("fv-msg").textContent = "✅ 저장했어요";
      };
      $("fv-off").onclick = async () => {
        const pw = $("fv-pw").value;
        if (!pw) return msg("관리 비밀번호를 넣어주세요", true);
        if (!confirm("지금 이벤트를 지울까요? 플레이어 화면에서 바로 사라져요.")) return;
        const err = await feverRpc("fever_clear", { p_pw: pw, p_id: FEVER_ID });
        if (err) return msg(`못 껐어요 — ${err}`, true);
        await loadFever();
        renderPanel();
        $("fv-msg").textContent = "✅ 껐어요";
      };
    }

    async function load() {
      // 캐시를 먼저 비워요. fetch가 도는 동안 hashchange가 나도 낡은 데이터를 그리지 않아요.
      STATE = null;
      $("overview").innerHTML = `<p class="empty">불러오는 중…</p>`;
      renderTabs();    // STATE가 null이라 탭을 숨기고 비워요
      renderPanel();   // STATE가 null이라 패널을 비워요

      let summary, choices, daily, failed = false;
      try { summary = await getView("stats_summary"); } catch { failed = true; }
      try { choices = await getView("stats_choices"); } catch { failed = true; }
      try { daily = await getView("stats_daily"); } catch { failed = true; }
      /* 🌍 리그 뷰는 **없어도 넘어가요.** 나중에 붙인 뷰라 SQL을 아직 안 돌렸을 수
       * 있어요 — 여기서 failed로 잡으면 멀쩡한 화면 전체가 "설정이 필요해요"로 덮여요. */
      let league = [];
      try { league = await getView("stats_league"); } catch { league = []; }
      await loadFever();          // 🎉 피버 타임 — 집계 뷰와 무관하게 늘 읽어요
      const hofRows = await getHof();
      let hofTotal = null, hofByGame = null;
      if (hofRows) {
        hofByGame = {};
        for (const r of hofRows) hofByGame[r.game] = (hofByGame[r.game] || 0) + 1;
        hofTotal = hofRows.length;
      }

      if (failed || !summary) {
        // 집계 뷰가 없으면 탭이 의미 없어요 — 안내 카드만 남겨요.
        // ↻를 연타하면 load()가 겹쳐 도는데, 늦게 끝난 실패가 먼저 성공한 실행의 STATE와
        // 펼쳐진 탭을 만날 수 있어요. 그래서 여기서 한 번 더 비워요.
        // STATE를 남겨두면 이후 hashchange가 낡은 데이터를 패널에 다시 그려요.
        STATE = null;
        renderTabs();
        renderPanel();
        $("overview").innerHTML = setupCard("아직 집계 뷰가 없거나 접근할 수 없어요.");
        wireCopy();
        return;
      }

      STATE = { summary, choices: choices || [], daily: daily || [], league: league || [], hofRows, hofByGame, hofTotal };
      // 새로고침일 땐 보던 탭을 유지하고, 첫 진입이면 해시에서 읽어요.
      activeGame = activeGame || gameFromHash();

      renderOverview();
      $("tabs").hidden = false;
      renderTabs();
      renderPanel();
    }

    function wireCopy() {
      const btn = $("copysql");
      if (btn) btn.onclick = () => {
        navigator.clipboard?.writeText(SETUP_SQL).then(
          () => (btn.textContent = "✅ 복사됨!"),
          () => (btn.textContent = "복사 실패")
        );
      };
    }

    $("refresh").onclick = load;

    // 탭 클릭은 해시만 바꿔요. 렌더는 hashchange 한 곳이 전담해서 경로가 하나로 모여요.
    $("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (btn) location.hash = btn.dataset.game;
    });
    window.addEventListener("hashchange", () => {
      activeGame = gameFromHash();
      renderTabs();
      renderPanel();
    });

    // ---------- 방문 추이 막대 툴팁 (마우스오버 / 클릭·탭) ----------
    // load()가 내용을 다시 그려도 유지되도록 document에 위임해요.
    (function sparkTooltip() {
      const tip = document.createElement("div");
      tip.className = "sparktip";
      document.body.appendChild(tip);
      let activeCol = null;   // 현재 툴팁이 떠 있는 칼럼
      let pinned = null;      // 클릭/탭으로 고정된 칼럼 (모바일 탭 유지용)
      const inCol = (el) => (el && el.closest ? el.closest(".spark .col") : null);
      function showFor(col) {
        if (!col || !col.dataset.info) return;
        if (activeCol && activeCol !== col) activeCol.classList.remove("active");
        activeCol = col;
        col.classList.add("active");
        tip.textContent = col.dataset.info;
        const r = col.getBoundingClientRect();
        tip.style.left = r.left + r.width / 2 + "px";
        tip.style.top = r.top + "px";
        tip.style.display = "block";
      }
      function hide() {
        tip.style.display = "none";
        if (activeCol) { activeCol.classList.remove("active"); activeCol = null; }
      }
      // 마우스 오버: 고정된 게 없을 때만 미리보기로 표시
      document.addEventListener("mouseover", (e) => {
        if (pinned) return;
        const c = inCol(e.target);
        if (c) showFor(c);
      });
      document.addEventListener("mouseout", (e) => {
        if (pinned) return;
        const c = inCol(e.target);
        if (!c) return;
        // 같은 칼럼 안(자식 요소)으로 이동한 거면 닫지 않아요
        if (inCol(e.relatedTarget) !== c) hide();
      });
      // 클릭/탭: 고정 토글 (모바일은 hover가 없어 이걸로 표시)
      document.addEventListener("click", (e) => {
        const c = inCol(e.target);
        if (c) { if (pinned === c) { pinned = null; hide(); } else { pinned = c; showFor(c); } }
        else { pinned = null; hide(); }
      });
      document.addEventListener("focusin", (e) => {
        const c = inCol(e.target);
        if (c) showFor(c);
      });
      window.addEventListener("scroll", () => { pinned = null; hide(); }, { passive: true });
    })();

    // ---------- 비밀번호 게이트 ----------
    // 소스에는 비번 평문이 아니라 SHA-256 해시만 담겨요.
    // 비번 변경: 콘솔에서
    //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('새비번'))
    //     .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
    // 로 새 해시를 뽑아 아래 PW_HASH 값을 바꾸면 돼요.
    const PW_HASH = "fbb9231b254d3e4674b21df93f9e65050c9a89d551e86561a96c74085c75d88b";
    const REMEMBER_KEY = "grow-stats-auth";

    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, "0")).join("");
    }

    function unlock() {
      $("gate").style.display = "none";
      $("wrap").hidden = false;
      load();
    }

    function lock() {
      try { localStorage.removeItem(REMEMBER_KEY); } catch { /* noop */ }
      try { sessionStorage.removeItem(REMEMBER_KEY); } catch { /* noop */ }
      location.reload();
    }

    async function initGate() {
      // 기억해둔 인증(해시 일치)이 있으면 바로 통과
      try {
        const saved = localStorage.getItem(REMEMBER_KEY) || sessionStorage.getItem(REMEMBER_KEY);
        if (saved && saved === PW_HASH) { unlock(); return; }
      } catch { /* noop */ }

      $("gate-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const val = $("gate-pw").value;
        const h = await sha256(val);
        if (h === PW_HASH) {
          try {
            const store = $("gate-remember").checked ? localStorage : sessionStorage;
            store.setItem(REMEMBER_KEY, h);
          } catch { /* noop */ }
          unlock();
        } else {
          $("gate-err").textContent = "비밀번호가 틀렸어요";
          $("gate-pw").value = "";
          $("gate-pw").focus();
        }
      });
      $("gate-pw").focus();
    }

    $("lockout").onclick = lock;
    initGate();
  </script>
</body>
</html>
